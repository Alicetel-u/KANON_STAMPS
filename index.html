<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff4f9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KANON STAMPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<title>KANON STAMPS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fx" aria-hidden="true">
  <div class="fx-aurora"></div>
  <div class="fx-blob pink"></div>
  <div class="fx-blob blue"></div>
  <div class="fx-blob yellow"></div>
  <div class="fx-follow"></div>
  <div class="fx-grain"></div>
</div>
<main class="app">
  <header>
    <div class="brand">K</div>
    <div>
      <p>KANON'S STICKER KIT</p>
      <h1>KANON STAMPS</h1>
    </div>
    <button id="favOnly" class="fav-filter" aria-pressed="false" aria-label="お気に入りだけ表示">♡</button>
  </header>
  <section class="hero">
    <div class="hero-rings" aria-hidden="true"></div>
    <div class="hero-sparkles" aria-hidden="true"></div>
    <div class="hero-copy">
      <span>PINK × BLUE ENERGY</span>
      <h2>気持ちを、<br><em>一発で伝えよう。</em></h2>
      <p>タップしてコピー。LINEやメッセージにぺたっと送れます。</p>
      <div class="stats"><b>83</b><small>ORIGINAL<br>STICKERS</small></div>
    </div>
    <img src="stamps/hero.webp" srcset="stamps/hero-sm.webp 480w, stamps/hero.webp 960w" sizes="(max-width:560px) 70vw, 450px" alt="配信中のKANON" width="960" height="960">
  </section>
  <section class="collection-head">
    <div>
      <span>THE COLLECTION</span>
      <h2>どれを送る？</h2>
    </div>
    <p><i></i> ALL READY</p>
  </section>
  <nav id="categories" class="categories" aria-label="スタンプの種類"></nav>
  <section id="grid" class="grid"></section>
  <section id="empty" class="empty" hidden>
    <span>♡</span>
    <h2 id="emptyTitle">スタンプがありません</h2>
    <p id="emptyText">別の種類を選んでみてください。</p>
  </section>
  <footer>
    <b>KANON STAMPS</b>
    <span>MADE WITH ♡ &amp; ENERGY</span>
  </footer>
</main>
<div class="modal" id="modal" hidden>
  <div class="modalcard">
    <button id="close" class="x" aria-label="閉じる">×</button>
    <div class="preview-well">
      <img id="preview" alt="選択したスタンプ">
    </div>
    <div class="modal-title">
      <span>SELECTED STICKER</span>
      <h2 id="selected"></h2>
    </div>
    <button id="copy" class="copy">画像をコピー</button>
    <button id="share" class="share">LINEなどで送る</button>
    <button id="save" class="save">PNGを保存</button>
    <p id="notice" role="status"></p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
